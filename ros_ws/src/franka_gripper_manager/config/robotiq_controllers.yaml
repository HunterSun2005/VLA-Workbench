/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz
      joint_state_broadcaster_robotiq:
        type: joint_state_broadcaster/JointStateBroadcaster
      robotiq_gripper_controller:
        type: position_controllers/GripperActionController
      robotiq_activation_controller:
        type: robotiq_controllers/RobotiqActivationController

  joint_state_broadcaster_robotiq:
    ros__parameters:
      use_local_topics: true

  robotiq_gripper_controller:
    ros__parameters:
      default: true
      joint: robotiq_85_left_knuckle_joint
      use_effort_interface: true
      use_speed_interface: true
      # Grasping an object stalls the fingers short of the commanded position. Report
      # that as success (result.stalled=true) instead of ABORTED: the collector treats
      # status 6 as a control fault, which must stay reserved for real failures.
      allow_stalling: true

  robotiq_activation_controller:
    ros__parameters:
      default: true
