version: 1

state:
  source_key: observation.state
  components:
    tcp_position_xyz: true
    tcp_rot6d: true
    gripper: true
    force_xyz: true
    torque_xyz: true
    linear_velocity_xyz: true
    angular_velocity_xyz: true
    joint_positions: false
    joint_torques: false
    external_joint_torques: false
    joint_velocities: false
  component_features:
    tcp_position_xyz: [tcp_position_x, tcp_position_y, tcp_position_z]
    tcp_rot6d:
      - tcp_rot6d_col0_x
      - tcp_rot6d_col0_y
      - tcp_rot6d_col0_z
      - tcp_rot6d_col1_x
      - tcp_rot6d_col1_y
      - tcp_rot6d_col1_z
    gripper: [gripper_position]
    force_xyz: [base_tcp_force_x, base_tcp_force_y, base_tcp_force_z]
    torque_xyz: [base_tcp_torque_x, base_tcp_torque_y, base_tcp_torque_z]
    linear_velocity_xyz:
      - base_tcp_linear_velocity_x
      - base_tcp_linear_velocity_y
      - base_tcp_linear_velocity_z
    angular_velocity_xyz:
      - base_tcp_angular_velocity_x
      - base_tcp_angular_velocity_y
      - base_tcp_angular_velocity_z
    joint_positions:
      - joint_position_1
      - joint_position_2
      - joint_position_3
      - joint_position_4
      - joint_position_5
      - joint_position_6
      - joint_position_7
    joint_torques:
      - joint_torque_1
      - joint_torque_2
      - joint_torque_3
      - joint_torque_4
      - joint_torque_5
      - joint_torque_6
      - joint_torque_7
    external_joint_torques:
      - external_joint_torque_1
      - external_joint_torque_2
      - external_joint_torque_3
      - external_joint_torque_4
      - external_joint_torque_5
      - external_joint_torque_6
      - external_joint_torque_7
    joint_velocities:
      - joint_velocity_1
      - joint_velocity_2
      - joint_velocity_3
      - joint_velocity_4
      - joint_velocity_5
      - joint_velocity_6
      - joint_velocity_7
  output_order:
    - tcp_position_xyz
    - tcp_rot6d
    - gripper
    - force_xyz
    - torque_xyz
    - linear_velocity_xyz
    - angular_velocity_xyz
    - joint_positions
    - joint_torques
    - external_joint_torques
    - joint_velocities

action:
  expected_dim: 10
